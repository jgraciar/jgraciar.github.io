name: Reparar caché y publicar calculadora

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-calculadora-hotfix.yml
      - assets/calculadora-sistemas.br.b64
      - scripts/layout-calculadora.mjs
      - scripts/calculadora-ejemplos-fraccionarios.mjs
      - scripts/CalculatorClassical.js
      - scripts/patch-calculadora-metodos.mjs
      - tests/calculadora-metodos.test.mjs
      - tests/verify-calculadora-metodos-ui.mjs
      - tests/calculadora-ejemplos.test.mjs
      - tests/calculadora-decimales.test.mjs
      - scripts/package-circuits-jgr.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-calculadora-hotfix
  cancel-in-progress: true

jobs:
  publish:
    name: Publicar último sitio verificado con reparador de caché
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener corrección del trabajador de servicio
        uses: actions/checkout@v4
      - name: Seleccionar la última compilación completa aprobada con artefacto disponible
        id: verified
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id:'pages.yml', status:'success', per_page:30});
            for (const run of runs.data.workflow_runs) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id:run.id});
              if (data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) {
                core.setOutput('run_id', String(run.id));
                core.info('Sitio verificado: '+run.html_url);
                return;
              }
            }
            core.setFailed('No hay un sitio completo verificado con artefacto disponible.');
      - name: Recuperar la última compilación completa aprobada
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: verified-site
      - name: Preparar Node.js para la calculadora
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Montar portal verificado y corregir la caché
        run: |
          set -euo pipefail
          test -s verified-site/artifact.tar
          mkdir -p site-root
          tar -xf verified-site/artifact.tar -C site-root
          cp service-worker.js site-root/service-worker.js
          node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            import {brotliDecompressSync} from "node:zlib";
            import assert from "node:assert/strict";
            const archive=readFileSync("assets/calculadora-sistemas.br.b64","utf8").trim();
            const parts=brotliDecompressSync(Buffer.from(archive,"base64")).toString("utf8").split(String.fromCharCode(0));
            const names=["index.html","solver.js","app.js","style.css"];
            assert.equal(parts.length,names.length);
            names.forEach((name,i)=>{
              assert(parts[i].length>0);
              writeFileSync("site-root/calculadora/"+name,parts[i]);
            });
          '
          node scripts/layout-calculadora.mjs site-root/calculadora
          node scripts/calculadora-ejemplos-fraccionarios.mjs site-root/calculadora
          node scripts/patch-calculadora-metodos.mjs site-root/calculadora
          node tests/calculadora-ejemplos.test.mjs site-root/calculadora
          node tests/calculadora-decimales.test.mjs site-root/calculadora
          node tests/calculadora-metodos.test.mjs site-root/calculadora
          test -s site-root/calculadora/style.css
          grep -Fq 'class="workbench"' site-root/calculadora/index.html
          grep -Fq 'class="entry-pane"' site-root/calculadora/index.html
          grep -Fq 'class="output-pane"' site-root/calculadora/index.html
          grep -Fq 'class="result-placeholder"' site-root/calculadora/index.html
          grep -Fq 'border-left:2px solid #a9bdcd' site-root/calculadora/style.css
          node --check site-root/calculadora/app.js
          node --check site-root/calculadora/solver.js
          grep -Fq 'data-example="unique"' site-root/calculadora/index.html
          grep -Fq 'data-example="infinite"' site-root/calculadora/index.html
          grep -Fq 'data-example="none"' site-root/calculadora/index.html
          grep -Fq "setMode('grid')" site-root/calculadora/app.js
          ! grep -Fq 'Herramienta independiente' site-root/calculadora/index.html
          test -s site-root/index.html
          test -s site-root/calculadora/index.html
          test -s site-root/calculadora/solver.js
          test -s site-root/calculadora/app.js
          test -s site-root/calculadora/style.css
          test -s site-root/circuitjgr.html
          grep -Fq 'href="./calculadora/"' site-root/index.html
          grep -Fq 'href="./circuitjgr.html"' site-root/index.html
          grep -Fq 'href="./electrotecnia/"' site-root/index.html
          grep -Fq 'name.startsWith("circuitjs-cache")' site-root/service-worker.js
          grep -Fq 'cache:"no-store"' site-root/service-worker.js
          echo 'Portal, simulador y calculadora verificados; corrección de caché incluida'
      - name: Verificar los ocho métodos en ambas pestañas con Chromium
        run: |
          cd tests
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          cd ..
          python3 -m http.server 8767 --directory site-root >/tmp/calculadora-http.log 2>&1 &
          node tests/verify-calculadora-metodos-ui.mjs
      - name: Evitar sustituir una compilación completa publicada mientras se verificaba la calculadora
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id:'pages.yml', status:'success', per_page:1});
            if (String(data.workflow_runs[0]?.id) !== '${{ steps.verified.outputs.run_id }}') {
              core.setFailed('Se ha publicado un sitio completo más reciente. No se reemplaza por el anterior.');
            }
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site-root
      - name: Publicar portal
        id: deployment
        uses: actions/deploy-pages@v4

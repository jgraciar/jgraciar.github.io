name: Wormhoff regression tests
on:
  push:
    paths:
      - 'wormhoff/**'
      - '.github/workflows/wormhoff-tests.yml'
  pull_request:
    paths:
      - 'wormhoff/**'
      - '.github/workflows/wormhoff-tests.yml'
jobs:
  electrical-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Kirchhoff electrical engine
        run: node --test wormhoff/mesh-engine.test.mjs


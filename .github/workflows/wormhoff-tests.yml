name: Wormhoff regression tests
on:
  push:
    paths:
      - 'wormhoff/**'
      - '.github/workflows/wormhoff-tests.yml'
  pull_request:
    paths:
      - 'wormhoff/**'
      - '.github/workflows/wormhoff-tests.yml'
jobs:
  electrical-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Kirchhoff electrical engine
        run: node --test wormhoff/mesh-engine.test.mjs

  browser-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify type 5 integration in Chromium
        run: node wormhoff/type5-browser.test.mjs
      - name: Preserve visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wormhoff-type4-type5-visual
          path: |
            wormhoff/type4-desktop.png
            wormhoff/type5-desktop.png
            wormhoff/type4-mobile.png
            wormhoff/type5-mobile.png
          if-no-files-found: warn

# Publicación de Circuit JGR desde su propio código fuente, separado del laboratorio.
# Publica Circuit JGR 1.0 en https://jgraciar.github.io/circuitjgr.html.
# El proyecto original y el laboratorio no se modifican.
name: Publicar Circuit JGR 1.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Circuit JGR con entrada propia
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener el código fuente propio de Circuit JGR
        uses: actions/checkout@v4
        with:
          path: adaptacion
          persist-credentials: false

      - name: Obtener versión base de CircuitJS
        uses: actions/checkout@v4
        with:
          repository: pfalstad/circuitjs1
          ref: 8d694e2ce2657b53a94a81b4816e3d19dcb645b5
          path: circuitjs-src
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pruebas numéricas de los componentes propios
        run: |
          node --experimental-strip-types adaptacion/tests/lab-power-measurement.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-digital-ics.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-digital-msi.test.mjs
          node --experimental-strip-types adaptacion/tests/ic-info.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-cd4026.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-counters.test.mjs
          node adaptacion/tests/lab-resonance-transient.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-impedance.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-pv-inverter.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-pv-catalog-inverter.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-pv-current-display.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-filtered-bridge.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-filtered-bridge-power.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-filtered-bridge-convergence.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-nonlinear-load.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-harmonics.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-robustness.test.mjs
          node --experimental-strip-types adaptacion/tests/lab-power-factor-rectifier.test.mjs

      - name: Preparar motor, componentes, traducciones e identidad
        run: |
          node adaptacion/scripts/embed-default-aron.mjs circuitjs-src/ts/CirSim.ts adaptacion/tests/fixtures/sistema-iii-n-startup.xml
          node adaptacion/scripts/patch-wattmeter-powers.mjs circuitjs-src/ts/WattmeterTrueElm.ts adaptacion/scripts/LabPowerMeasurement.ts
          node adaptacion/scripts/patch-impedance.mjs circuitjs-src/ts adaptacion/scripts/ImpedanceElm.ts adaptacion/scripts/LabImpedance.ts
          node adaptacion/scripts/patch-pv-inverter.mjs circuitjs-src/ts adaptacion/scripts/PVInverterElm.ts adaptacion/scripts/LabPVInverter.ts
          node adaptacion/scripts/patch-cd4026.mjs circuitjs-src/ts
          node --experimental-strip-types adaptacion/scripts/patch-digital-ics.mjs circuitjs-src/ts
          node adaptacion/scripts/patch-lab-localization.mjs circuitjs-src/ts adaptacion/scripts/LabTranslations.ts
          node adaptacion/scripts/prepare-circuits-jgr.mjs circuitjs-src/ts
          node --experimental-strip-types adaptacion/tests/verify-edit-regional-numbers.mjs circuitjs-src/ts
          node --experimental-strip-types adaptacion/tests/verify-edit-dialog-titles.mjs circuitjs-src/ts
          node --experimental-strip-types adaptacion/tests/verify-about-and-draw-locales.mjs circuitjs-src/ts
          node --experimental-strip-types adaptacion/tests/verify-nonlinear-presets.mjs circuitjs-src/ts
          node --experimental-strip-types adaptacion/tests/verify-six-pulse-static.mjs circuitjs-src/ts

      - name: Compilar circuitjgr.html como entrada real
        working-directory: circuitjs-src/ts
        run: |
          npm ci
          npm run build
          test -s dist/circuitjgr.html
          ! test -f dist/circuitjs.html

      - name: Generar sitio raíz y portada
        run: |
          node adaptacion/scripts/package-circuits-jgr.mjs circuitjs-src/ts site-root adaptacion
          node adaptacion/scripts/promote-tabbed-workspace.mjs site-root
          node adaptacion/tests/calculadora-decimales.test.mjs site-root/calculadora
          node adaptacion/tests/calculadora-ejemplos.test.mjs site-root/calculadora
          test -s site-root/index.html
          test -s site-root/circuitjgr.html
          test -s site-root/circuitjgr-core.html
          test -s site-root/tabs-experimental.html
          test -s site-root/circuitjs/about.html
          test -s site-root/LICENSE-GPLv3.txt
          test -s site-root/COPYING-CircuitJS.txt
          test -s site-root/circuitjs/circuits/cd4026-practice.xml
          ! test -e site-root/circuitjs/circuits/cd4026-practice-textbook.xml
          test -s site-root/circuitjs/setuplist.txt
          test -s site-root/circuitjs/circuits/7493-practice.xml
          test -s site-root/circuitjs/circuits/74191-practice.xml
          ! grep -q 'cd4026-practice-textbook.xml' site-root/circuitjs/setuplist.txt

      - name: Instalar Chromium para prueba funcional
        working-directory: adaptacion/tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          # Ubuntu runner already provides the browser runtime libraries.
          npx playwright install chromium

      - name: Verificar portada, simulador y Acerca de
        run: |
          python3 -m http.server 8767 --directory site-root >/tmp/circuitjgr-http.log 2>&1 &
          sleep 2
          node adaptacion/tests/verify-counters-ui.mjs
          node adaptacion/tests/verify-tabs-experimental-ui.mjs
          node adaptacion/tests/verify-live-settings-ui.mjs
          node adaptacion/tests/verify-light-palette-ui.mjs
          node adaptacion/tests/verify-scope-status-ui.mjs
          node adaptacion/tests/verify-circuits-jgr-root.mjs site-root
          CIRCUIT_URL=http://127.0.0.1:8767/circuitjgr-core.html FALSTAD_EXAMPLES=circuitjs-src/ts/public/circuits CHECK_REPORT=/tmp/project-checks node adaptacion/tests/verify-project-pending.mjs
          node adaptacion/tests/verify-upstream-505-ui.mjs
          node --experimental-strip-types adaptacion/tests/verify-ic-info-ui.mjs
          node --experimental-strip-types adaptacion/tests/verify-digital-ics-ui.mjs
          node adaptacion/tests/verify-edit-regional-ui.mjs
          node adaptacion/tests/verify-circuitjgr-elements.mjs
          node adaptacion/tests/verify-nonlinear-presets-ui.mjs
          node adaptacion/tests/verify-nonlinear-units-ui.mjs
          node adaptacion/tests/verify-six-pulse-ui.mjs
          node adaptacion/tests/verify-wattmeter-ui.mjs
          node adaptacion/tests/verify-cd4026-ui.mjs

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Adjuntar sitio de Circuit JGR
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site-root

  deploy:
    name: Desplegar Circuit JGR en la raíz
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4


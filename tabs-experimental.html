<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Circuit JGR</title>
<style>
:root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;color:#202020}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:white}
#workspace{position:absolute;inset:0;min-height:0;background:white}
.session{position:absolute;inset:0;visibility:hidden;pointer-events:none}
.session.active{visibility:visible;pointer-events:auto;z-index:1}
#workspace[data-layout="horizontal"],#workspace[data-layout="vertical"]{display:grid;gap:2px;overflow:auto;background:#bcbcbc}
#workspace[data-layout="vertical"]{grid-auto-flow:column;grid-auto-columns:minmax(320px,1fr);grid-template-rows:minmax(280px,1fr)}
#workspace[data-layout="horizontal"]{grid-auto-flow:row;grid-auto-rows:minmax(280px,1fr);grid-template-columns:minmax(320px,1fr)}
#workspace:not([data-layout="single"]) .session{position:relative;inset:auto;visibility:visible;pointer-events:auto;min-width:0;min-height:0}
#workspace:not([data-layout="single"]) .session.active::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:10;border:4px solid #ffd85a;box-sizing:border-box}#workspace:not([data-layout="single"]) .session.active[data-white="true"]::after{border-color:#0050a4}
#shared-chrome{position:absolute;inset:0 0 auto;height:auto;z-index:50;background:#e8e8e8;overflow:visible} #shared-chrome[hidden]{display:none}
.session iframe{width:100%;height:100%;border:0;background:white;display:block}
#open-files{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#notice{position:absolute;left:8px;bottom:7px;z-index:3;background:#fffff2;color:#333;
 border:1px solid #bbb;padding:5px 9px;font-size:12px;max-width:min(620px,90vw)}
#notice:empty{display:none}
</style>
</head>

nt;width:34px!important;height:30px!important;padding:3px!important}[data-jgr-icon] *{font-size:0!important}\n[data-jgr-icon=\"settings\"]::before{content:\"\";display:inline-block;width:20px;height:20px;background:currentColor;mask:url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M16.32%206.35%20L17.05%208.11%20L18.89%207.62%20L18.89%2012.38%20L17.05%2011.89%20L16.32%2013.65%20L16.32%2013.65%20L15.16%2015.16%20L16.51%2016.51%20L12.38%2018.89%20L11.89%2017.05%20L10.00%2017.30%20L10.00%2017.30%20L8.11%2017.05%20L7.62%2018.89%20L3.49%2016.51%20L4.84%2015.16%20L3.68%2013.65%20L3.68%2013.65%20L2.95%2011.89%20L1.11%2012.38%20L1.11%207.62%20L2.95%208.11%20L3.68%206.35%20L3.68%206.35%20L4.84%204.84%20L3.49%203.49%20L7.62%201.11%20L8.11%202.95%20L10.00%202.70%20L10.00%202.70%20L11.89%202.95%20L12.38%201.11%20L16.51%203.49%20L15.16%204.84%20L16.32%206.35%20Z%22%2F%3E%3Ccircle%20cx%3D%2210%22%20cy%3D%2210%22%20r%3D%222.7%22%2F%3E%3C%2Fsvg%3E\") center/contain no-repeat;vertical-align:middle}\n[data-jgr-icon=\"reset\"]::before{content:\"\";display:inline-block;width:20px;height:20px;background:currentColor;mask:url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M4%206a7%207%200%201%201-1%207M4%201v5h5%22%2F%3E%3C%2Fsvg%3E\") center/contain no-repeat;vertical-align:middle}\n[data-jgr-icon=\"runstop\"]::before{content:\"\";display:inline-block;width:20px;height:20px;background:currentColor;mask:url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M3%203v14l10-7zM17%203v14%22%2F%3E%3C%2Fsvg%3E\") center/contain no-repeat;vertical-align:middle}\n[data-jgr-icon]{background:transparent!important;border:0!important;border-radius:0!important;color:#333!important;box-shadow:none!important}[data-jgr-icon]:hover{background:#d3d3d3!important}#jgr-tab-strip > .lab-start-settings{position:static!important;flex:0 0 30px!important;width:30px!important;min-width:30px!important;height:29px!important;margin:0!important;padding:3px!important;align-self:center}";
 const workspace=document.querySelector("#workspace");
 const openInput=document.querySelector("#open-files");
 const notice=document.querySelector("#notice");
 const tabs=[];
 const BLANK='<cir f="0" ts="0.00005" ic="125" cb="50" pb="50" vr="5" mts="5e-11"></cir>';
 let active=null, serial=0, unnamed=0, layoutMode="single", layoutMenuCleanup=null;
 let tabGesture=null, renderQueued=false, suppressTabClickUntil=0, dirtySignature="";

 function find(id){return tabs.find(t=>t.id===id);}

 function apiFor(t){try{return t?.frame.contentWindow.CircuitJS1||null;}catch{return null;}}

 function isModified(t){
  const app=appFor(t);
  if(!t?.ready||!app)return false;
  try{return !!app.isModified();}catch{return true;}
 }
 function ensureStrip(t){
  const app=appFor(t);
  if(!app?.ui?.layoutPanel)return null;
  const doc=t.frame.contentDocument;
  let strip=t.strip||doc.getElementById("jgr-tab-strip");
  if(!strip){
   const style=doc.createElement("style");
   style.textContent=TAB_CSS;
   doc.head.append(style);
   strip=doc.createElement("nav");
   strip.id="jgr-tab-strip";
   strip.setAttribute("aria-label",tr(t,"open"));
   app.ui.layoutPanel.append(strip);t.strip=strip;
   // Los menús desplegables originales deben quedar por encima de las pestañas.
   app.menus.menuBar.style.zIndex="20";
   doc.defaultView.addEventListener("resize",()=>{positionStrip(t);if(active)revealTab(active,t);});
  }
  positionStrip(t);
  return strip;
 }
 function shared(){return layoutMode!=="single";}
 function syncChrome(){
  const host=document.getElementById("shared-chrome");
  host.inert=!active?.ready;
  if(!active?.ready)return;
  if(!document.getElementById("shared-tabs-style")){const style=document.createElement("style");style.id="shared-tabs-style";style.textContent=TAB_CSS;document.head.append(style);}
  if(!document.getElementById("shared-engine-styles")){
   const marker=document.createElement("meta");marker.id="shared-engine-styles";document.head.prepend(marker);
   for(const node of active.frame.contentDocument.querySelectorAll('link[rel="stylesheet"],style')){
    const copy=node.cloneNode(true);if(copy.tagName==="LINK")copy.href=node.href;document.head.insertBefore(copy,document.head.querySelector('style'));
   }
  }
  for(const t of tabs){
   const app=appFor(t);if(!t.ready||!app)continue;
   t.frame.contentWindow.__JGRSharedChrome=shared();
   t.palettes??=[...t.frame.contentDocument.querySelectorAll('.palette-container')];
   for(const palette of t.palettes){const dest=shared()&&t===active?document.body:t.frame.contentDocument.body;if(palette.parentElement!==dest){palette.style.display="none";dest.append(palette);}}
   for(const node of [app.menus.menuBar,app.ui.toolbar.element,t.strip]){
    if(!node)continue;
    const dest=shared()&&t===active?host:app.ui.layoutPanel;
    if(node.parentElement!==dest)dest.append(node);
    if(node===t.strip)node.style.display=shared()&&t!==active?"none":"";
    else if(node===app.menus.menuBar)node.style.display=shared()&&t!==active?"none":app.ui.hideMenu?"none":"";
    else node.style.display=shared()&&t!==active?"none":app.menus.toolbarCheckItem.getState()?"flex":"none";
   }
   positionStrip(t);
  }
  host.hidden=!shared();
  const a=appFor(active),height=(a.ui.hideMenu?0:30)+(a.menus.toolbarCheckItem.getState()?40:0)+33;
  host.style.height=height+"px";workspace.style.top=shared()?height+"px":"0px";
 }
 function presentSettings(modal){
  if(!document.getElementById("global-settings-style")){
   const source=[...modal.ownerDocument.querySelectorAll("style")].find(style=>style.textContent.includes(".lab-start-modal"));
   if(source){const style=source.cloneNode(true);style.id="global-settings-style";document.head.append(style);}
  }
  const previous=document.getElementById("lab-start-modal");
  if(previous&&previous!==modal){previous.close();previous.hidden=true;previous.__jgrHome?.body.append(previous);}
  modal.__jgrHome??=modal.ownerDocument;
  document.body.append(modal);
  modal.style.cssText="position:fixed;inset:0;margin:auto;height:fit-content;width:min(460px,calc(100vw - 32px));max-height:calc(100dvh - 32px);font-size:12px;overflow:auto;z-index:2147483647;";
  if(!modal.__jgrReturn){
   modal.__jgrReturn=true;
   modal.addEventListener("close",()=>{if(modal.open)return;document.body.classList.remove("lab-start-open");modal.hidden=true;if(modal.ownerDocument===document)modal.__jgrHome.body.append(modal);});
  }
 }
 function iconButtons(t){
  const app=appFor(t);if(!app)return;
  for(const [button,icon] of [[app.ui.resetButton,"reset"],[app.ui.runStopButton,"runstop"],[t.settings||t.frame.contentWindow.__JGRSettingsButton,"settings"]]){
   if(!button)continue;
   const running=!!apiFor(t)?.isRunning();
   const label=icon==="runstop"?button.textContent.split("/")[running?1:0].trim():button.textContent.trim();

 function positionStrip(t){
  const app=appFor(t);
  const strip=t.strip||t.frame?.contentDocument?.getElementById("jgr-tab-strip");
  if(!app||!strip)return;
  const top=(app.ui.hideMenu?0:30)+(app.menus.toolbarCheckItem.getState()?40:0);
  strip.style.top=top+"px";
  // Toda la cabecera ocupa el ancho disponible; el panel empieza bajo las pestañas.
  const panel=app.ui.verticalPanel;
  panel.style.top=(shared()?0:top+33)+"px";
  app.ui.canvasWrapper.style.top=(shared()?0:top+33)+"px";
  panel.style.display=t.sidebarVisible?"":"none";
  app.ui.toolbar.element.style.right="0px";
  const width=app.ui.constructor.VERTICALPANELWIDTH;
  app.ui.canvasWrapper.style.right=t.sidebarVisible?width+"px":"0px";
 }
 function toggleSidebar(){
  const t=active,app=appFor(t);if(!t||!app)return;
  t.sidebarVisible=!t.sidebarVisible;
  positionStrip(t);app.ui.setCanvasSize();app.ui.repaint();renderTabs();
 }
 function sessionVisible(t){return layoutMode!=="single"||t===active;}
 function layoutSessions(){
  workspace.dataset.layout=layoutMode;
  tabs.forEach((t,index)=>{
   t.section.dataset.white=String(!!apiFor(t)?.getWhiteBackground?.());
   t.section.style.order=String(index);
   t.section.classList.toggle("active",t===active);
   t.section.setAttribute("aria-hidden",String(!sessionVisible(t)));

 function syncVisibleSimulations(){
  for(const t of tabs){
   if(!t.ready)continue;
   const api=apiFor(t),visible=sessionVisible(t);
   if(t.visible&&!visible){t.resume=api.isRunning();api.setSimRunning(false);}
   else if(!t.visible&&visible)api.setSimRunning(t.resume);
   t.visible=visible;
  }

 function resizeSessions(){
  requestAnimationFrame(()=>{
   for(const t of tabs){

    positionStrip(t);app.ui.setCanvasSize();app.ui.repaint();

 function showLayoutMenu(session,button){
  if(button.getAttribute("aria-expanded")==="true"){closeLayoutMenu();return;}
  closeLayoutMenu();
  const doc=button.ownerDocument,view=doc.defaultView;
  const menu=doc.createElement("div");menu.className="jgr-layout-menu";

   const option=doc.createElement("button");option.type="button";option.dataset.layout=mode;
   option.setAttribute("role","menuitemradio");option.setAttribute("aria-checked",String(layoutMode===mode));
   const mark=doc.createElement("span");mark.className="layout-mark";mark.setAttribute("aria-hidden","true");mark.textContent=layoutMode===mode?"✓":"";

   menu.append(option);return option;
  });

  menu.style.left=Math.max(6,Math.min(box.right-menu.offsetWidth,view.innerWidth-menu.offsetWidth-6))+"px";
  menu.style.top=Math.max(6,Math.min(box.bottom+2,view.innerHeight-height-6))+"px";

   if(event.key==="Escape"){event.preventDefault();event.stopImmediatePropagation();closeLayoutMenu();button.focus({preventScroll:true});return;}
   if(event.key==="Tab"){closeLayoutMenu();return;}
   if(event.key==="Enter"||event.key===" "){
    event.preventDefault();event.stopImmediatePropagation();choices.find(option=>option===doc.activeElement)?.click();return;
   }
   if(!["ArrowUp","ArrowDown","Home","End"].includes(event.key))return;
   event.preventDefault();event.stopImmediatePropagation();
   let index=choices.indexOf(doc.activeElement);
   index=event.key==="Home"?0:event.key==="End"?2:(index+(event.key==="ArrowDown"?1:2))%3;

  }
  doc.addEventListener("pointerdown",outside,true);doc.addEventListener("keydown",key,true);
  view.addEventListener("resize",closeLayoutMenu);view.addEventListener("blur",closeLayoutMenu);
  layoutMenuCleanup=()=>{menu.remove();button.setAttribute("aria-expanded","false");button.removeAttribute("aria-controls");doc.removeEventListener("pointerdown",outside,true);doc.removeEventListener("keydown",key,true);view.removeEventListener("resize",closeLayoutMenu);view.removeEventListener("blur",closeLayoutMenu);};

 function renderTabs(){
  if(tabGesture){renderQueued=true;return;}

   const tabsEl=ensureStrip(session);

     if(event.altKey&&event.shiftKey&&["ArrowLeft","ArrowRight"].includes(event.key)){

   plus.setAttribute("aria-label",tr(session,"new"));
   bindTabAction(plus,()=>newBlank());
   tabsEl.append(plus);
   const duplicate=doc.createElement("button");
   duplicate.type="button";duplicate.id="duplicate-tab";
   duplicate.title=tr(session,"duplicate");duplicate.setAttribute("aria-label",duplicate.title);
   duplicate.disabled=!active?.ready;
   duplicate.innerHTML='<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1" fill="none" stroke="currentColor"/><path d="M4 13H3V3h10v1" fill="none" stroke="currentColor"/></svg>';
   bindTabAction(duplicate,duplicateActive);
   tabsEl.append(duplicate);
   const arrange=doc.createElement("button");arrange.type="button";arrange.id="arrange-tabs";
   arrange.title=tr(session,"arrange");arrange.setAttribute("aria-label",arrange.title);
   arrange.setAttribute("aria-haspopup","menu");arrange.setAttribute("aria-expanded","false");arrange.dataset.layout=layoutMode;
   const divider=layoutMode==="horizontal"?'<path d="M10 3v14" stroke="currentColor"/>':layoutMode==="vertical"?'<path d="M2 10h16" stroke="currentColor"/>':'<path d="M2 7h16" stroke="currentColor"/>';
   arrange.innerHTML='<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="1" fill="none" stroke="currentColor"/>'+divider+'</svg>';
   bindTabAction(arrange,()=>showLayoutMenu(session,arrange));tabsEl.append(arrange);
   const sideToggle=doc.createElement("button");
   sideToggle.type="button";sideToggle.id="jgr-sidebar-toggle";
   const toggleLabel=tr(session,active?.sidebarVisible?"hide":"show");
   sideToggle.innerHTML='<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="1" fill="none" stroke="currentColor"/><path d="M13 3v14" stroke="currentColor"/></svg><span class="sidebar-label"></span>';
   sideToggle.querySelector(".sidebar-label").textContent=toggleLabel;
   sideToggle.setAttribute("aria-label",toggleLabel);
   sideToggle.setAttribute("aria-expanded",String(!!active?.sidebarVisible));
   sideToggle.title=toggleLabel;
   bindTabAction(sideToggle,toggleSidebar);
   tabsEl.append(sideToggle);
   if(session.settings)tabsEl.append(session.settings);
   tabList.scrollLeft=previousScroll;iconButtons(session);
  }
  syncChrome();
  document.title="Circuit JGR";
  dirtySignature=tabs.map(t=>t.id+":"+modified.get(t.id)).join("|");
 }
 function bindTabAction(button,action){
  let lastTouch=-Infinity;
  button.style.touchAction="manipulation";
  button.onpointerup=event=>{
   if(event.pointerType!=="touch")return;
   lastTouch=performance.now();event.preventDefault();event.stopPropagation();action();
  };
  button.onclick=event=>{
   if(performance.now()-lastTouch<500){event.preventDefault();event.stopPropagation();return;}
   action();
  };
 }
 function revealTab(t,session){
  const node=session?.strip?.querySelector('.tab[data-tab-id="'+t.id+'"]');
  node?.scrollIntoView({block:"nearest",inline:"nearest"});
 }
 function moveTab(id,index,session=active){
  const from=tabs.findIndex(t=>t.id===id);
  if(from<0)return false;
  index=Math.max(0,Math.min(tabs.length-1,index));
  if(index===from)return false;
  const [tab]=tabs.splice(from,1);tabs.splice(index,0,tab);
  renderTabs();revealTab(tab,session);
  session?.frame.contentDocument?.querySelector('.tab[data-tab-id="'+id+'"] .choose')?.focus({preventScroll:true});
  return true;
 }
 function markTabDrop(gesture){
  const {list,x,id}=gesture;
  list.querySelectorAll('.drop-before,.drop-after').forEach(node=>node.classList.remove('drop-before','drop-after'));
  const others=[...list.querySelectorAll('.tab')].filter(node=>node.dataset.tabId!==id);
  const next=others.findIndex(node=>{const box=node.getBoundingClientRect();return x<box.left+box.width/2;});
  gesture.index=next<0?others.length:next;
  if(next>=0)others[next].classList.add('drop-before');else others.at(-1)?.classList.add('drop-after');
 }
 function startTabGesture(event,tab,session,button,list){
  if(event.button!==0||tabGesture)return;
  const gesture={id:tab.id,session,button,list,pointer:event.pointerId,startX:event.clientX,x:event.clientX,
   scroll:list.scrollLeft,started:performance.now(),mode:null,index:tabs.indexOf(tab),raf:0};
  tabGesture=gesture;
  button.setPointerCapture(event.pointerId);
  const view=button.ownerDocument.defaultView;
  function autoScroll(){
   if(tabGesture!==gesture||gesture.mode!=="reorder")return;
   const box=list.getBoundingClientRect();
   if(gesture.x<box.left+22)list.scrollLeft-=10;else if(gesture.x>box.right-22)list.scrollLeft+=10;
   markTabDrop(gesture);gesture.raf=view.requestAnimationFrame(autoScroll);
  }
  function move(e){
   if(e.pointerId!==gesture.pointer||tabGesture!==gesture)return;
   gesture.x=e.clientX;
   const dx=e.clientX-gesture.startX;
   if(!gesture.mode&&Math.abs(dx)>=6){
    gesture.mode=e.pointerType==="touch"&&performance.now()-gesture.started<250?"scroll":"reorder";
    if(gesture.mode==="reorder"){button.closest('.tab').classList.add('dragging');autoScroll();}
   }
   if(gesture.mode){e.preventDefault();e.stopPropagation();}
   if(gesture.mode==="scroll")list.scrollLeft=gesture.scroll-dx;
   if(gesture.mode==="reorder")markTabDrop(gesture);
  }
  function finish(e){
   if(tabGesture!==gesture||(e.pointerId!==undefined&&e.pointerId!==gesture.pointer))return;
   tabGesture=null;view.cancelAnimationFrame(gesture.raf);
   button.removeEventListener('pointermove',move);button.removeEventListener('pointerup',finish);
   button.removeEventListener('pointercancel',finish);button.removeEventListener('lostpointercapture',cancel);
   button.ownerDocument.removeEventListener('keydown',cancelKey,true);
   view.removeEventListener('blur',cancel);
   if(button.hasPointerCapture(gesture.pointer))button.releasePointerCapture(gesture.pointer);
   list.querySelectorAll('.dragging,.drop-before,.drop-after').forEach(node=>node.classList.remove('dragging','drop-before','drop-after'));
   if(gesture.mode)suppressTabClickUntil=performance.now()+300;
   const queued=renderQueued;renderQueued=false;
   if(e.type==='pointerup'&&gesture.mode==='reorder'){
    if(!moveTab(gesture.id,gesture.index,gesture.session)&&queued)renderTabs();
   }else if(gesture.mode||e.type!=='pointerup'){
    if(queued)renderTabs();
   }else if(queued)view.setTimeout(renderTabs,0);
  }
  function cancel(){finish({type:'pointercancel'});}
  function cancelKey(e){if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();cancel();}}
  button.addEventListener('pointermove',move);button.addEventListener('pointerup',finish);
  button.addEventListener('pointercancel',finish);button.addEventListener('lostpointercapture',cancel);
  button.ownerDocument.addEventListener('keydown',cancelKey,true);
  view.addEventListener('blur',cancel);
 }
 function activate(t){
  if(!t||!find(t.id)||t===active)return;
  if(active)active.pendingPaste=null;
  active=t;layoutSessions();syncVisibleSimulations();
  renderTabs();resizeSessions();revealTab(t,t);message("");
 }
 function setName(t,name){
  if(!name||!name.trim())return;
  t.name=name.trim().slice(0,170);
  if(t.frame)t.frame.title="Circuit JGR: "+t.name;
  // Mantener el encabezado nativo del panel sincronizado con el nombre
  // de la pestaña, también tras «Guardar como...».
  const app=appFor(t);
  if(app?.ui?.titleLabel)app.ui.setCircuitTitle(t.name);
  renderTabs();
 }
 function getBounds(elements){
  let left=Infinity,top=Infinity,right=-Infinity,bottom=-Infinity;
  for(const elm of elements){
   const box=elm.getBoundingBox();
   if(!box)continue;
   left=Math.min(left,box.x);top=Math.min(top,box.y);
   right=Math.max(right,box.x+box.width);bottom=Math.max(bottom,box.y+box.height);
  }
  return Number.isFinite(left)?{cx:(left+right)/2,cy:(top+bottom)/2}:null;
 }
 function movePending(t,clientX,clientY){
  const pending=t.pendingPaste,app=appFor(t);
  if(!pending||!app)return;
  const canvas=app.ui.cv;
  const bounds=canvas.getBoundingClientRect();
  const sx=clientX-bounds.left,sy=clientY-bounds.top;
  // No permitir colocar fuera del área de circuito ni sobre el osciloscopio.
  const area=app.circuitArea;
  if(sx<0||sy<0||sx>area.width||sy>area.height)return;
  const center=getBounds(pending.elements);
  if(!center)return;
  const gx=app.snapGrid(app.mouse.inverseTransformX(sx));
  const gy=app.snapGrid(app.mouse.inverseTransformY(sy));
  const dx=app.snapGrid(gx-center.cx),dy=app.snapGrid(gy-center.cy);
  if(!dx&&!dy)return;
  if(!pending.elements.every(el=>el.allowMove(dx,dy)))return;
  for(const el of pending.elements)el.move(dx,dy);
  app.needAnalyze();
  app.repaint();
 }
 function startPaste(t,before){
  const app=appFor(t);
  const added=app.elmList.slice(before);
  if(!added.length)return;
  t.pendingPaste={elements:added};
  const canvas=app.ui.cv;
  // Centrar inicialmente el conjunto en el área visible.
  const rect=canvas.getBoundingClientRect();
  movePending(t,rect.left+app.circuitArea.width/2,rect.top+app.circuitArea.height/2);
  message("Desplaza los elementos con el ratón y pulsa para colocarlos. Esc para cancelar.");
 }
 function attachPastePlacement(t){
  const app=appFor(t);
  const canvas=app.ui.cv;
  canvas.addEventListener("mousemove",e=>{
   if(t.pendingPaste)movePending(t,e.clientX,e.clientY);
  },true);
  canvas.addEventListener("mousedown",e=>{
   if(!t.pendingPaste||e.button!==0)return;
   movePending(t,e.clientX,e.clientY);
   t.pendingPaste=null;
   message("");
   e.preventDefault();e.stopImmediatePropagation();
  },true);
  t.frame.contentDocument.addEventListener("keydown",e=>{
   if(t.pendingPaste&&e.key==="Escape"){
    t.pendingPaste=null;
    app.undoManager.doUndo();
    app.repaint();
    message("");
    e.preventDefault();e.stopImmediatePropagation();
    return;
   }
   if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==="n"){
    e.preventDefault();e.stopImmediatePropagation();
    newBlank();
   }
  },true);
 }
 function interceptNativeFileMenu(t){
  const app=appFor(t);
  if(!app||!app.commands||t.intercepted)return;
  t.intercepted=true;
  const nativeRun=app.ui.setSimRunning.bind(app.ui);
  app.ui.setSimRunning=function(state){const result=nativeRun(state);iconButtons(t);return result;};
  const originalToolbar=app.ui.setToolbar.bind(app.ui);
  app.ui.setToolbar=function(){
   const result=originalToolbar();
   positionStrip(t);if(shared()){syncChrome();resizeSessions();}
   return result;
  };
  const previous=app.commands.menuPerformed.bind(app.commands);
  app.commands.menuPerformed=function(menu,item){
   if(item==="newblankcircuit"){newBlank();return;}
   if(item==="importfromlocalfile"){openInput.click();return;}
   if(item==="exportaslocalfile"||item==="saveas"){
    saveAs(t);return;
   }
   if(item==="paste"){
    const before=app.elmList.length;
    const result=previous(menu,item);
    startPaste(t,before);
    return result;
   }
   return previous(menu,item);
  };
  const originalTitle=app.setCircuitTitle.bind(app);
  app.setCircuitTitle=function(title){
   originalTitle(title);
   if(title&&t.ready)setName(t,title);
  };
  attachPastePlacement(t);
 }
 function saveAs(t){
  const app=appFor(t);
  if(!t?.ready||!app)return;
  // Se conserva el diálogo «Guardar como...» del propio CircuitJS.
  // El nombre y el indicador de cambios cambian solo al confirmar la descarga.
  app.commands.doExportAsLocalFile();
 }
 function removeTab(t){
  const i=tabs.indexOf(t);
  if(i<0)return;
  const wasActive=t===active;
  const simulation=apiFor(t);
  if(simulation)simulation.setSimRunning(false);
  // La confirmación de salida ya se ha gestionado en esta interfaz.
  const app=appFor(t);if(app)app.unsavedChanges=false;
  tabs.splice(i,1);
  if(app){for(const node of [app.menus.menuBar,app.ui.toolbar.element,t.strip])if(node?.ownerDocument===document)app.ui.layoutPanel.append(node);}
  for(const palette of t.palettes||[])if(palette.ownerDocument===document)t.frame.contentDocument.body.append(palette);
  t.frame.src="about:blank";
  t.section.remove();
  if(wasActive){
   active=null;
   if(tabs.length)activate(tabs[Math.min(i,tabs.length-1)]);
  }
  renderTabs();resizeSessions();
  if(!tabs.length)message("No hay circuitos abiertos.");
 }
 // Este aviso utiliza el diálogo nativo del propio CircuitJS.
 // Se construye dentro del simulador activo para heredar exactamente
 // las reglas CSS de dialog.circuitDialog, tipografía y botones.
 function requestClose(t){
  if(!find(t.id))return;
  if(!isModified(t)){removeTab(t);return;}
  if(t!==active)activate(t);
  const doc=t.frame.contentDocument;
  if(doc.getElementById("jgr-close-dialog"))return;
  const dialog=doc.createElement("dialog");
  dialog.id="jgr-close-dialog";
  dialog.className="circuitDialog";
  dialog.setAttribute("aria-labelledby","jgr-close-title");
  const title=doc.createElement("h3");
  title.id="jgr-close-title";
  title.textContent=tr(t,"saveTitle");
  title.style.margin="0 0 8px 0";
  dialog.append(title);
  const question=doc.createElement("div");
  question.id="jgr-close-question";
  question.textContent=tr(t,"question",t.name);
  dialog.append(question);
  const detail=doc.createElement("div");
  detail.textContent=tr(t,"loss");
  detail.style.marginTop="8px";
  dialog.append(detail);
  const actions=doc.createElement("div");
  actions.style.display="flex";
  actions.style.justifyContent="space-between";
  actions.style.gap="8px";
  actions.style.marginTop="8px";
  const save=doc.createElement("button");
  save.type="button";save.id="jgr-close-save";save.textContent=tr(t,"save");
  const discard=doc.createElement("button");
  discard.type="button";discard.id="jgr-close-discard";discard.textContent=tr(t,"discard");
  const cancel=doc.createElement("button");
  cancel.type="button";cancel.id="jgr-close-cancel";cancel.textContent=tr(t,"cancel");
  actions.append(save,discard,cancel);
  dialog.append(actions);
  const dismiss=()=>{if(dialog.open)dialog.close();else dialog.remove();};
  save.addEventListener("click",()=>{
   dismiss();
   t.closeAfterSave=true;
   saveAs(t);
  });
  discard.addEventListener("click",()=>{
   dismiss();
   removeTab(t);
  });
  cancel.addEventListener("click",dismiss);
  dialog.addEventListener("cancel",e=>{e.preventDefault();dismiss();});
  dialog.addEventListener("close",()=>dialog.remove(),{once:true});
  // Los atajos del editor no deben actuar sobre el circuito bajo el diálogo.
  dialog.addEventListener("keydown",e=>e.stopPropagation());
  doc.body.append(dialog);
  dialog.showModal();
  save.focus();
 }
 window.addEventListener("message",async event=>{
  if(event.origin!==location.origin||event.data?.source!=="circuit-jgr-tabs")return;
  const t=tabs.find(item=>item.frame.contentWindow===event.source);
  if(!t)return;
  if(event.data.action==="settings-changed"){
   await Promise.all(tabs.filter(other=>other!==t&&other.ready).map(other=>apiFor(other).applyInitialSettings({...event.data.settings,notify:false})));
   renderTabs();
  }else if(event.data.action==="saved"){
   const a=appFor(t);
   if(a){a.unsavedChanges=false;a.savedDumpPending=true;}
   setName(t,event.data.name);
   if(t.closeAfterSave){t.closeAfterSave=false;removeTab(t);}
   else renderTabs();
  }else if(event.data.action==="save-canceled"){
   t.closeAfterSave=false;
  }
 });
 function addTab(name,content,openedFile=false,options={}){
  const t={id:"jgr-"+(++serial),name,ready:false,resume:options.running??true,frame:null,section:null,
   pendingPaste:null,closeAfterSave:false,openedFile,intercepted:false,sidebarVisible:layoutMode!=="vertical"};
  const section=document.createElement("section");
  section.className="session";section.dataset.tabId=t.id;
  section.setAttribute("aria-hidden","true");
  const iframe=document.createElement("iframe");
  iframe.dataset.tabId=t.id;iframe.title="Circuit JGR: "+name;
  const url=new URL("./circuitjgr.html",location.href);
  url.searchParams.set("jgr-tabs-prototype",t.id);
  // Las nuevas pestañas arrancan vacías, sin heredar ejemplos de la URL.
  if(content!==null){
   for(const key of ["cct","ctz","startCircuit","startCircuitLink"])url.searchParams.delete(key);
   url.searchParams.set("cct",BLANK);
  }
  iframe.src=url.href;
  section.append(iframe);workspace.append(section);
  t.section=section;t.frame=iframe;
  tabs.push(t);activate(t);
  const started=Date.now();
  const waiter=setInterval(()=>{
   if(!find(t.id)){clearInterval(waiter);return;}
   const a=apiFor(t),app=appFor(t);
   if(!a||!app||!app.commands||!app.ui?.cv){
    if(Date.now()-started>60000){
     clearInterval(waiter);message("No se pudo cargar el circuito: "+t.name);
    }
    return;
   }
   clearInterval(waiter);
   try{
    interceptNativeFileMenu(t);
    const selectSession=event=>{
     if(layoutMode!=="single"&&t!==active&&!event.target.closest?.("#jgr-tab-strip,.jgr-layout-menu"))activate(t);
    };
    t.frame.contentDocument.addEventListener("pointerdown",selectSession,true);
    t.frame.contentDocument.addEventListener("focusin",selectSession,true);
    // No sobrescribir el circuito inicial con un circuito vacío.
    // Nuevo circuito y Abrir archivo siguen importando su contenido.
    if(content!==null)a.importCircuit(content,false);
    app.setCircuitTitle(name);
    app.unsavedChanges=false;
    app.savedDumpPending=true;
    t.ready=true;
    if(options.running===undefined)t.resume=a.isRunning();
    t.visible=sessionVisible(t);
    a.setSimRunning(t.visible&&t.resume);
    if(options.duplicate){app.unsavedChanges=true;app.savedDump=null;app.savedDumpPending=false;}
    renderTabs();resizeSessions();
    if(t===active)revealTab(t,t);
    message("");
   }catch(error){
    message("No se pudo abrir «"+t.name+"»: "+error.message);
   }
  },120);
  return t;
 }
 function newBlank(){return addTab("Sin título "+(++unnamed),BLANK,false);}
 function duplicateActive(){
  const source=active,api=apiFor(source);
  if(!source?.ready||!api)return;
  const content=api.exportCircuit(),running=api.isRunning();
  return addTab(tr(source,"copyName",source.name),content,false,{running,duplicate:true});
 }
 async function openFiles(files){
  for(const file of files){
   if(file.size>=1280000){message("Archivo demasiado grande: "+file.name);continue;}
   try{addTab(file.name,await file.text(),true);}
   catch(error){message("Error al abrir «"+file.name+"»: "+error.message);}
  }
 }
 openInput.addEventListener("change",async event=>{
  const files=Array.from(event.target.files||[]);
  event.target.value="";
  await openFiles(files);
 });
 document.addEventListener("keydown",event=>{if(event.key==="Escape"&&shared()){
  const modal=active?.frame.contentDocument?.querySelector('#lab-start-modal[open]');
  if(modal){event.preventDefault();event.stopImmediatePropagation();const view=active.frame.contentWindow;if(modal.dispatchEvent(new view.Event("cancel",{cancelable:true})))modal.close();return;}
document.querySelectorAll(".gwt-MenuItem.open,li.hasSubmenu.open").forEach(n=>n.classList.remove("open"));document.querySelectorAll(".palette-container").forEach(p=>p.style.display="none");}});
 document.addEventListener("click",event=>{
  if(!event.target.closest?.(".mainToolbar,.palette-container"))document.querySelectorAll(".palette-container").forEach(p=>p.style.display="none");
  if(!event.target.closest?.(".menuBar,.gwt-MenuBar,.gwt-MenuItem"))document.querySelectorAll('.gwt-MenuItem.open,li.hasSubmenu.open').forEach(n=>n.classList.remove('open'));
 });
 for(const type of ["mousemove","mouseup"]){document.addEventListener(type,event=>{
  if(!shared()||!active?.ready)return;
  const f=active.frame,r=f.getBoundingClientRect(),view=f.contentWindow;
  f.contentDocument.dispatchEvent(new view.MouseEvent(type,{clientX:event.clientX-r.left,clientY:event.clientY-r.top,button:event.button,buttons:event.buttons,bubbles:true}));
 });}
 window.addEventListener("beforeunload",event=>{
  if(tabs.some(t=>isModified(t))){
   event.preventDefault();event.returnValue="";
  }
 });
 // Actualizar asterisco de cambios mediante el estado nativo, sin tocar el solver.
 setInterval(()=>{
  const signature=tabs.map(t=>t.id+":"+isModified(t)).join("|");
  if(signature!==dirtySignature){dirtySignature=signature;renderTabs();}
 },900);
 window.JGRTabsExperimental={
  list:()=>tabs.map(t=>({id:t.id,name:t.name,ready:t.ready,active:t===active,modified:isModified(t)})),
  activate:id=>activate(find(id)),
  getActive:()=>active?.id??null,
  newBlank,
  duplicateActive,
  setLayout,
  getLayout:()=>layoutMode,
  presentSettings,
  openFilePicker:()=>openInput.click()
 };
 unnamed=1;
 addTab('Circuito inicial',null,false);
})();
